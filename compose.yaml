services:
  db:
    image: postgres:17
    container_name: washnlearn-db
    environment:
      POSTGRES_USER: washnlearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: washnlearn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washnlearn -d washnlearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: